# FHIR Lakehouse – Databricks Job Definition
# Orchestrates the full ingestion → transformation → analytics pipeline.

resources:
  jobs:
    fhir_lakehouse_pipeline:
      name: fhir_lakehouse_pipeline
      description: "FHIR data ingestion and transformation pipeline"
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: /Workspace/fhir-databricks/notebooks/00_setup.py

        - task_key: ingest
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: /Workspace/fhir-databricks/notebooks/01_ingest_resource.py

        - task_key: bronze_to_silver
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: /Workspace/fhir-databricks/notebooks/02_bronze_to_silver.py

        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: /Workspace/fhir-databricks/notebooks/03_silver_to_gold.py

        - task_key: data_quality
          depends_on:
            - task_key: silver_to_gold
          notebook_task:
            notebook_path: /Workspace/fhir-databricks/notebooks/04_data_quality.py
      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2