[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-lakehouse"
version = "0.1.0"
description = "FHIR data lakehouse on Databricks"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FHIR Lakehouse Team" }]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"